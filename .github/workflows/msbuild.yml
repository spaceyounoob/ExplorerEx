# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "ExplorerEx-Vista" ]
  pull_request:
    branches: [ "ExplorerEx-Vista" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: ReleaseDebug

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    # Add this step to install C++ ATL components
    - name: Install Visual Studio ATL Component
      run: |
        & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify `
        --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
        --add Microsoft.VisualStudio.Component.VC.ATL `
        --quiet --norestart
      shell: powershell

    - uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: amd64
        
    - name: Compile ExplorerEx (explorer.exe)
      run: | 
        msbuild explorer.sln /p:Configuration=Release /p:Platform=x64

    - name: Set short git commit SHA
      id: vars
      shell: bash
      run: |
        calculatedSha=$(git rev-parse --short ${{ github.sha }})
        echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV
    - name: Upload exe
      uses: actions/upload-artifact@v4.4.0
      with:
        name: ExplorerEx-${{ env.COMMIT_SHORT_SHA }}
        path: |
          .\src\\x64\Release\
